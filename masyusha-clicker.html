<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Масюша моя</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --violet-deep:#2e1065;
    --violet-1:#6d28d9;
    --violet-2:#9333ea;
    --pink-1:#ec4899;
    --pink-2:#f472b6;
    --pink-glow:#f9a8d4;
    --gold:#fcd34d;
    --glass-fill:rgba(255,255,255,0.14);
    --glass-fill-strong:rgba(255,255,255,0.22);
    --glass-border:rgba(255,255,255,0.35);
    --text-light:#fdf4ff;
    --text-soft:#e9d5ff;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;min-height:100%;
    font-family:'Nunito', sans-serif;
    color:var(--text-light);
    overflow-x:hidden;
    position:relative;
  }
  body{
    background:
      radial-gradient(circle at 15% 20%, rgba(244,114,182,0.55), transparent 45%),
      radial-gradient(circle at 85% 15%, rgba(147,51,234,0.55), transparent 50%),
      radial-gradient(circle at 50% 90%, rgba(236,72,153,0.45), transparent 55%),
      linear-gradient(160deg,#3b0764 0%, #6d28d9 45%, #be185d 100%);
    background-size:180% 180%, 180% 180%, 180% 180%, 220% 220%;
    animation:bgshift 16s ease-in-out infinite;
    min-height:100vh;
  }
  @keyframes bgshift{
    0%{background-position:0% 0%,100% 0%,50% 100%,0% 0%;}
    50%{background-position:100% 100%,0% 100%,50% 0%,100% 100%;}
    100%{background-position:0% 0%,100% 0%,50% 100%,0% 0%;}
  }

  .deco{
    position:fixed;
    pointer-events:none;
    z-index:0;
    filter:blur(1px);
    opacity:0.55;
  }
  .deco.sparkle{
    font-size:22px;
    animation:twinkle 3.2s ease-in-out infinite, drift 9s ease-in-out infinite;
  }
  @keyframes twinkle{
    0%,100%{opacity:0.25; transform:scale(0.8) rotate(0deg);}
    50%{opacity:0.9; transform:scale(1.2) rotate(20deg);}
  }
  @keyframes drift{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-18px);}
  }
  .blob{
    position:fixed;
    border-radius:50%;
    filter:blur(40px);
    opacity:0.35;
    z-index:0;
    animation:blobmove 14s ease-in-out infinite;
  }
  @keyframes blobmove{
    0%,100%{transform:translate(0,0) scale(1);}
    50%{transform:translate(20px,-30px) scale(1.15);}
  }

  .wrap{
    max-width:540px;
    margin:0 auto;
    padding:44px 20px 70px;
    text-align:center;
    position:relative;
    z-index:2;
  }

  h1{
    font-family:'Baloo 2', sans-serif;
    font-size:46px;
    font-weight:800;
    margin:4px 0 6px;
    background:linear-gradient(90deg,#fff, var(--pink-glow), #fff);
    background-size:200% auto;
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    animation:shine 4s linear infinite, float 3.6s ease-in-out infinite;
    text-shadow:0 0 40px rgba(244,114,182,0.5);
  }
  @keyframes shine{
    to{background-position:200% center;}
  }
  @keyframes float{
    0%,100%{transform:translateY(0) rotate(-1deg);}
    50%{transform:translateY(-6px) rotate(1deg);}
  }
  .subtitle{
    font-size:15px;
    color:var(--text-soft);
    margin-bottom:26px;
    font-weight:600;
  }

  .glass-panel{
    background:var(--glass-fill);
    border:1px solid var(--glass-border);
    border-radius:28px;
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    box-shadow:0 8px 32px rgba(46,16,101,0.35), inset 0 1px 0 rgba(255,255,255,0.4);
    padding:26px 20px 22px;
    position:relative;
    overflow:hidden;
  }
  .glass-panel::before{
    content:'';
    position:absolute;
    top:-40%; left:-20%;
    width:70%; height:180%;
    background:linear-gradient(120deg, rgba(255,255,255,0.25), transparent 60%);
    transform:rotate(15deg);
    pointer-events:none;
  }

  .counter-label{
    font-size:12px;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--text-soft);
    font-weight:700;
    margin-bottom:4px;
  }
  .counter{
    font-family:'Baloo 2', sans-serif;
    font-size:58px;
    font-weight:800;
    color:#fff;
    margin:0 0 6px;
    transition:transform 0.12s ease;
    text-shadow:0 4px 20px rgba(0,0,0,0.25);
  }
  .counter.bump{
    transform:scale(1.2) rotate(-2deg);
  }

  .mult-badge{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:linear-gradient(120deg, var(--gold), #f59e0b);
    color:#3b1d00;
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:13px;
    padding:5px 14px;
    border-radius:100px;
    margin-bottom:18px;
    opacity:0;
    transform:scale(0.7);
    transition:all 0.35s cubic-bezier(.2,.9,.3,1.4);
    box-shadow:0 4px 14px rgba(245,158,11,0.5);
  }
  .mult-badge.show{
    opacity:1;
    transform:scale(1);
  }

  .click-btn{
    position:relative;
    border:none;
    outline:none;
    cursor:pointer;
    font-family:'Baloo 2', sans-serif;
    background:var(--glass-fill-strong);
    border:1.5px solid rgba(255,255,255,0.55);
    color:#fff;
    font-size:22px;
    font-weight:700;
    padding:22px 46px;
    border-radius:100px;
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    box-shadow:
      0 10px 30px rgba(190,24,93,0.45),
      inset 0 1px 0 rgba(255,255,255,0.6),
      inset 0 -6px 12px rgba(190,24,93,0.25);
    transition:transform 0.08s ease, box-shadow 0.2s ease;
    user-select:none;
    -webkit-tap-highlight-color:transparent;
    letter-spacing:0.3px;
  }
  .click-btn::after{
    content:'';
    position:absolute;
    top:6%; left:8%;
    width:40%; height:35%;
    background:linear-gradient(120deg, rgba(255,255,255,0.55), transparent);
    border-radius:100px;
    pointer-events:none;
  }
  .click-btn:hover{
    transform:translateY(-3px);
    box-shadow:
      0 16px 36px rgba(190,24,93,0.55),
      inset 0 1px 0 rgba(255,255,255,0.7),
      inset 0 -6px 12px rgba(190,24,93,0.3);
  }
  .click-btn:active{
    transform:scale(0.92);
  }
  .click-btn.pulse{
    animation:pulse 0.25s ease;
  }
  @keyframes pulse{
    0%{transform:scale(1);}
    40%{transform:scale(0.88);}
    100%{transform:scale(1);}
  }

  .heart{
    position:absolute;
    pointer-events:none;
    font-size:22px;
    animation:rise 1.15s ease-out forwards;
    z-index:5;
    filter:drop-shadow(0 2px 6px rgba(0,0,0,0.25));
  }
  @keyframes rise{
    0%{opacity:1; transform:translate(0,0) scale(0.6) rotate(0deg);}
    100%{opacity:0; transform:translate(var(--dx), -150px) scale(1.3) rotate(var(--rot));}
  }

  .goals{
    margin-top:34px;
    text-align:left;
  }
  .goals h2{
    font-family:'Baloo 2', sans-serif;
    font-size:17px;
    margin:0 0 16px;
    color:#fff;
    text-align:center;
    letter-spacing:0.3px;
  }
  .goals-hint{
    text-align:center;
    font-size:12.5px;
    color:var(--text-soft);
    margin:-10px 0 16px;
    font-weight:600;
    opacity:0.85;
  }
  .goal{
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px 14px;
    margin-bottom:10px;
    border-radius:18px;
    background:var(--glass-fill);
    border:1px solid rgba(255,255,255,0.22);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
  }
  .goal:last-child{margin-bottom:0;}
  .goal.done{
    background:rgba(74,222,128,0.14);
    border-color:rgba(74,222,128,0.4);
  }
  .goal.current{
    border-color:rgba(252,211,77,0.6);
    box-shadow:0 0 0 1px rgba(252,211,77,0.25), 0 6px 20px rgba(252,211,77,0.15);
  }
  .goal.reveal{
    animation:goalReveal 0.55s cubic-bezier(.2,.85,.3,1.2);
  }
  @keyframes goalReveal{
    0%{opacity:0; transform:translateY(14px) scale(0.92);}
    60%{opacity:1; transform:translateY(-3px) scale(1.02);}
    100%{opacity:1; transform:translateY(0) scale(1);}
  }
  .goal-icon{
    font-size:22px;
    width:34px;
    height:34px;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
    background:rgba(255,255,255,0.18);
    border-radius:12px;
  }
  .goal-text{
    flex:1;
    font-size:14.5px;
    font-weight:600;
    color:var(--text-light);
  }
  .goal-text b{color:var(--gold);}
  .goal-status{
    font-size:11.5px;
    font-weight:800;
    font-family:'Baloo 2', sans-serif;
    padding:4px 11px;
    border-radius:100px;
    background:rgba(255,255,255,0.2);
    color:#fff;
    white-space:nowrap;
  }
  .goal.done .goal-status{
    background:rgba(74,222,128,0.35);
    color:#dcfce7;
  }
  .goal.current .goal-status{
    background:rgba(252,211,77,0.35);
    color:#fef9c3;
  }

  .progress-track{
    margin-top:16px;
    text-align:center;
    font-size:12px;
    color:var(--text-soft);
    font-weight:700;
    letter-spacing:0.5px;
  }

  .toast{
    position:fixed;
    left:50%;
    bottom:30px;
    transform:translate(-50%,20px);
    background:var(--glass-fill-strong);
    border:1px solid var(--glass-border);
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
    color:#fff;
    padding:14px 22px;
    border-radius:18px;
    font-size:14.5px;
    font-weight:700;
    font-family:'Baloo 2', sans-serif;
    box-shadow:0 10px 30px rgba(0,0,0,0.35);
    opacity:0;
    transition:all 0.35s cubic-bezier(.2,.9,.3,1.3);
    z-index:50;
    max-width:88%;
    text-align:center;
  }
  .toast.show{
    opacity:1;
    transform:translate(-50%,0);
  }

  footer{
    margin-top:32px;
    font-size:12px;
    color:var(--text-soft);
    opacity:0.8;
    font-weight:600;
  }
</style>
</head>
<body>

<div class="blob" style="width:260px;height:260px;background:var(--pink-1);top:-60px;left:-60px;"></div>
<div class="blob" style="width:220px;height:220px;background:var(--violet-2);top:40%;right:-80px;animation-delay:3s;"></div>
<div class="blob" style="width:200px;height:200px;background:var(--gold);bottom:-60px;left:20%;animation-delay:6s;"></div>

<div class="deco sparkle" style="top:8%;left:12%;">✦</div>
<div class="deco sparkle" style="top:14%;right:14%;animation-delay:1s;">✧</div>
<div class="deco sparkle" style="top:60%;left:6%;animation-delay:2s;">✦</div>
<div class="deco sparkle" style="top:75%;right:8%;animation-delay:1.5s;">✧</div>
<div class="deco sparkle" style="top:35%;right:20%;animation-delay:2.5s;">✦</div>

<div class="wrap">
  <h1>Масюша моя</h1>
  <div class="subtitle">жми на кнопку, копи сердечки, открывай сюрпризы</div>

  <div class="glass-panel">
    <div class="counter-label">сердечек накоплено</div>
    <div class="counter" id="counter">0</div>
    <div class="mult-badge" id="multBadge">⚡ ×2 бонус активен</div>
    <br>
    <button class="click-btn" id="clickBtn">я тебя люблю</button>
  </div>

  <div class="goals" id="goals">
    <h2>✦ что можно получить ✦</h2>
    <div class="goals-hint">новая цель открывается, когда закрыта предыдущая</div>
    <!-- goals injected by JS -->
  </div>

  <div class="progress-track" id="progressTrack"></div>

  <footer>сделано с любовью специально для тебя</footer>
</div>

<div class="toast" id="toast"></div>

<script>
  const goalsData = [
    {target:5,    icon:'😘', text:'<b>5</b> кликов — воздушный поцелуй'},
    {target:15,   icon:'🤗', text:'<b>15</b> кликов — крепкие объятия'},
    {target:30,   icon:'☕', text:'<b>30</b> кликов — кофе вместе по-любому'},
    {target:50,   icon:'⚡', text:'<b>50</b> кликов — бонус ×2 к кликам'},
    {target:75,   icon:'🎵', text:'<b>75</b> кликов — совместный плейлист на вечер'},
    {target:100,  icon:'🎬', text:'<b>100</b> кликов — поход в кино'},
    {target:140,  icon:'🍩', text:'<b>140</b> кликов — сладости на двоих'},
    {target:180,  icon:'📸', text:'<b>180</b> кликов — фотосессия для настроения'},
    {target:220,  icon:'🍽️', text:'<b>220</b> кликов — ужин при свечах'},
    {target:270,  icon:'🎲', text:'<b>270</b> кликов — вечер настольных игр'},
    {target:320,  icon:'💐', text:'<b>320</b> кликов — букет просто так'},
    {target:380,  icon:'🎨', text:'<b>380</b> кликов — совместный мастер-класс'},
    {target:440,  icon:'🛍️', text:'<b>440</b> кликов — маленький шопинг-день'},
    {target:500,  icon:'🎁', text:'<b>500</b> кликов — сюрприз-подарок'},
    {target:580,  icon:'🌅', text:'<b>580</b> кликов — рассвет вдвоём'},
    {target:660,  icon:'🎢', text:'<b>660</b> кликов — день в парке аттракционов'},
    {target:750,  icon:'🍳', text:'<b>750</b> кликов — завтрак в постель'},
    {target:850,  icon:'🌌', text:'<b>850</b> кликов — ночь под звёздами'},
    {target:960,  icon:'💌', text:'<b>960</b> кликов — письмо с признаниями'},
    {target:1080, icon:'🏖️', text:'<b>1080</b> кликов — день на природе или пляже'},
    {target:1220, icon:'💍', text:'<b>1220</b> кликов — особенный вечер вдвоём'},
    {target:1400, icon:'✈️', text:'<b>1400</b> кликов — мини-путешествие вдвоём'},
  ];

  let count = 0;
  let multiplier = 1;
  let unlocked = 1; // сколько целей уже показано
  const reached = new Set();

  const counterEl = document.getElementById('counter');
  const btn = document.getElementById('clickBtn');
  const goalsEl = document.getElementById('goals');
  const toastEl = document.getElementById('toast');
  const multBadge = document.getElementById('multBadge');
  const progressTrack = document.getElementById('progressTrack');

  function renderGoals(justUnlockedIndex){
    goalsEl.querySelectorAll('.goal').forEach(n=>n.remove());
    const visible = goalsData.slice(0, unlocked);
    visible.forEach((g, i)=>{
      const done = count >= g.target;
      const isCurrent = !done && i === visible.length - 1;
      const div = document.createElement('div');
      div.className = 'goal' + (done ? ' done' : '') + (isCurrent ? ' current' : '') + (i === justUnlockedIndex ? ' reveal' : '');
      div.innerHTML = `
        <div class="goal-icon">${g.icon}</div>
        <div class="goal-text">${g.text}</div>
        <div class="goal-status">${done ? 'готово ✓' : g.target - count + ' ещё'}</div>
      `;
      goalsEl.appendChild(div);
    });
    progressTrack.textContent = `открыто целей: ${unlocked} из ${goalsData.length}`;
  }

  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(()=> toastEl.classList.remove('show'), 2600);
  }

  function spawnHearts(x, y, n){
    const emojis = ['💗','💕','💖','❤️','💞','💜'];
    for(let i=0;i<n;i++){
      const h = document.createElement('div');
      h.className = 'heart';
      h.textContent = emojis[Math.floor(Math.random()*emojis.length)];
      const dx = (Math.random()-0.5) * 160;
      const rot = (Math.random()-0.5) * 90;
      h.style.setProperty('--dx', dx+'px');
      h.style.setProperty('--rot', rot+'deg');
      h.style.left = x + 'px';
      h.style.top = y + 'px';
      document.body.appendChild(h);
      setTimeout(()=> h.remove(), 1300);
    }
  }

  function bumpCounter(){
    counterEl.classList.remove('bump');
    void counterEl.offsetWidth;
    counterEl.classList.add('bump');
  }

  btn.addEventListener('click', (e)=>{
    count += multiplier;
    counterEl.textContent = count;
    bumpCounter();

    btn.classList.remove('pulse');
    void btn.offsetWidth;
    btn.classList.add('pulse');

    const rect = btn.getBoundingClientRect();
    spawnHearts(rect.left + rect.width/2, rect.top, 3 + Math.floor(Math.random()*3));

    let justUnlockedIndex = -1;

    // проверяем только текущую (последнюю открытую) цель
    const currentGoal = goalsData[unlocked - 1];
    if(currentGoal && count >= currentGoal.target && !reached.has(currentGoal.target)){
      reached.add(currentGoal.target);
      if(currentGoal.target === 50){
        multiplier = 2;
        multBadge.classList.add('show');
      }
      showToast('🎉 ' + currentGoal.text.replace(/<[^>]+>/g,''));
      if(unlocked < goalsData.length){
        unlocked++;
        justUnlockedIndex = unlocked - 1;
      }
    }

    renderGoals(justUnlockedIndex);
  });

  renderGoals();
</script>
</body>
</html>
