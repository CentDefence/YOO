<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Масюша моя 💗</title>
<style>
  :root{
    --pink-1:#ffe3ec;
    --pink-2:#ffb8d0;
    --pink-3:#ff6f9c;
    --pink-4:#d43d6d;
    --cream:#fff7f9;
    --gold:#f6c667;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;height:100%;
    font-family:'Segoe UI', system-ui, sans-serif;
    background:linear-gradient(160deg,var(--pink-1),var(--cream) 60%,var(--pink-1));
    background-size:200% 200%;
    animation:bgshift 12s ease-in-out infinite;
    overflow-x:hidden;
    color:#5a2340;
  }
  @keyframes bgshift{
    0%{background-position:0% 0%;}
    50%{background-position:100% 100%;}
    100%{background-position:0% 0%;}
  }
  .wrap{
    max-width:520px;
    margin:0 auto;
    padding:36px 20px 60px;
    text-align:center;
    position:relative;
    min-height:100vh;
  }
  h1{
    font-size:42px;
    margin:10px 0 4px;
    color:var(--pink-4);
    letter-spacing:0.5px;
    text-shadow:0 2px 0 rgba(255,255,255,0.6);
    animation:float 3.5s ease-in-out infinite;
  }
  @keyframes float{
    0%,100%{transform:translateY(0) rotate(-1deg);}
    50%{transform:translateY(-6px) rotate(1deg);}
  }
  .subtitle{
    font-size:15px;
    color:#a25a7c;
    margin-bottom:28px;
  }
  .counter{
    font-size:52px;
    font-weight:700;
    color:var(--pink-4);
    margin:6px 0 2px;
    transition:transform 0.12s ease;
  }
  .counter.bump{
    transform:scale(1.18);
  }
  .mult-badge{
    display:inline-block;
    background:var(--gold);
    color:#5a2340;
    font-weight:600;
    font-size:13px;
    padding:4px 12px;
    border-radius:20px;
    margin-bottom:22px;
    opacity:0;
    transform:scale(0.8);
    transition:all 0.3s ease;
  }
  .mult-badge.show{
    opacity:1;
    transform:scale(1);
  }
  .click-btn{
    position:relative;
    border:none;
    outline:none;
    cursor:pointer;
    background:linear-gradient(135deg,var(--pink-3),var(--pink-4));
    color:#fff;
    font-size:22px;
    font-weight:600;
    padding:26px 44px;
    border-radius:100px;
    box-shadow:0 10px 24px rgba(212,61,109,0.35), inset 0 -4px 0 rgba(0,0,0,0.08);
    transition:transform 0.08s ease, box-shadow 0.2s ease;
    user-select:none;
    -webkit-tap-highlight-color:transparent;
  }
  .click-btn:hover{
    transform:translateY(-2px);
    box-shadow:0 14px 28px rgba(212,61,109,0.45), inset 0 -4px 0 rgba(0,0,0,0.08);
  }
  .click-btn:active{
    transform:scale(0.93);
  }
  .click-btn.pulse{
    animation:pulse 0.25s ease;
  }
  @keyframes pulse{
    0%{transform:scale(1);}
    40%{transform:scale(0.88);}
    100%{transform:scale(1);}
  }
  .heart{
    position:absolute;
    pointer-events:none;
    font-size:22px;
    color:var(--pink-4);
    animation:rise 1.1s ease-out forwards;
    z-index:5;
  }
  @keyframes rise{
    0%{opacity:1; transform:translate(0,0) scale(0.6) rotate(0deg);}
    100%{opacity:0; transform:translate(var(--dx), -140px) scale(1.3) rotate(var(--rot));}
  }
  .goals{
    margin-top:44px;
    text-align:left;
    background:rgba(255,255,255,0.55);
    border-radius:22px;
    padding:18px 20px;
    backdrop-filter:blur(6px);
    box-shadow:0 6px 20px rgba(212,61,109,0.1);
  }
  .goals h2{
    font-size:16px;
    margin:0 0 12px;
    color:var(--pink-4);
    text-align:center;
    letter-spacing:0.3px;
  }
  .goal{
    display:flex;
    align-items:center;
    gap:12px;
    padding:10px 4px;
    border-bottom:1px dashed rgba(212,61,109,0.2);
    transition:opacity 0.3s ease;
  }
  .goal:last-child{border-bottom:none;}
  .goal.done{
    opacity:0.5;
  }
  .goal-icon{
    font-size:22px;
    width:30px;
    text-align:center;
    flex-shrink:0;
  }
  .goal-text{
    flex:1;
    font-size:14.5px;
  }
  .goal-text b{color:var(--pink-4);}
  .goal-status{
    font-size:12px;
    font-weight:600;
    padding:3px 10px;
    border-radius:12px;
    background:var(--pink-2);
    color:#7a1f42;
    white-space:nowrap;
  }
  .goal.done .goal-status{
    background:#c8e6c9;
    color:#2e7d32;
  }
  .toast{
    position:fixed;
    left:50%;
    bottom:30px;
    transform:translate(-50%,20px);
    background:var(--pink-4);
    color:#fff;
    padding:14px 22px;
    border-radius:16px;
    font-size:14.5px;
    font-weight:600;
    box-shadow:0 10px 26px rgba(0,0,0,0.25);
    opacity:0;
    transition:all 0.35s cubic-bezier(.2,.9,.3,1.3);
    z-index:50;
    max-width:88%;
    text-align:center;
  }
  .toast.show{
    opacity:1;
    transform:translate(-50%,0);
  }
  footer{
    margin-top:30px;
    font-size:12px;
    color:#b98aa1;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Масюша моя 💗</h1>
  <div class="subtitle">жми на кнопку, копи сердечки, лови сюрпризы</div>

  <div class="counter" id="counter">0</div>
  <div class="mult-badge" id="multBadge">×2 бонус активен</div>
  <br>
  <button class="click-btn" id="clickBtn">я тебя люблю</button>

  <div class="goals" id="goals">
    <h2>что можно получить</h2>
    <!-- goals injected by JS -->
  </div>

  <footer>сделано с любовью специально для тебя</footer>
</div>

<div class="toast" id="toast"></div>

<script>
  const goalsData = [
    {target:10,  icon:'😘', text:'<b>10</b> кликов — воздушный поцелуй'},
    {target:25,  icon:'🤗', text:'<b>25</b> кликов — крепкие объятия'},
    {target:50,  icon:'⚡', text:'<b>50</b> кликов — бонус ×2 к кликам'},
    {target:100, icon:'🎬', text:'<b>100</b> кликов — поход в кино'},
    {target:200, icon:'🍽️', text:'<b>200</b> кликов — ужин при свечах'},
    {target:350, icon:'🎁', text:'<b>350</b> кликов — сюрприз-подарок'},
    {target:500, icon:'✈️', text:'<b>500</b> кликов — мини-путешествие вдвоём'},
  ];

  let count = 0;
  let multiplier = 1;
  const reached = new Set();

  const counterEl = document.getElementById('counter');
  const btn = document.getElementById('clickBtn');
  const goalsEl = document.getElementById('goals');
  const toastEl = document.getElementById('toast');
  const multBadge = document.getElementById('multBadge');

  function renderGoals(){
    goalsEl.querySelectorAll('.goal').forEach(n=>n.remove());
    goalsData.forEach(g=>{
      const done = count >= g.target;
      const div = document.createElement('div');
      div.className = 'goal' + (done ? ' done' : '');
      div.innerHTML = `
        <div class="goal-icon">${g.icon}</div>
        <div class="goal-text">${g.text}</div>
        <div class="goal-status">${done ? 'готово' : g.target - count + ' ещё'}</div>
      `;
      goalsEl.appendChild(div);
    });
  }

  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(()=> toastEl.classList.remove('show'), 2600);
  }

  function spawnHearts(x, y, n){
    const emojis = ['💗','💕','💖','❤️','💞'];
    for(let i=0;i<n;i++){
      const h = document.createElement('div');
      h.className = 'heart';
      h.textContent = emojis[Math.floor(Math.random()*emojis.length)];
      const dx = (Math.random()-0.5) * 160;
      const rot = (Math.random()-0.5) * 90;
      h.style.setProperty('--dx', dx+'px');
      h.style.setProperty('--rot', rot+'deg');
      h.style.left = x + 'px';
      h.style.top = y + 'px';
      document.body.appendChild(h);
      setTimeout(()=> h.remove(), 1200);
    }
  }

  function bumpCounter(){
    counterEl.classList.remove('bump');
    void counterEl.offsetWidth;
    counterEl.classList.add('bump');
  }

  btn.addEventListener('click', (e)=>{
    count += multiplier;
    counterEl.textContent = count;
    bumpCounter();

    btn.classList.remove('pulse');
    void btn.offsetWidth;
    btn.classList.add('pulse');

    const rect = btn.getBoundingClientRect();
    spawnHearts(rect.left + rect.width/2, rect.top, 3 + Math.floor(Math.random()*3));

    goalsData.forEach(g=>{
      if(count >= g.target && !reached.has(g.target)){
        reached.add(g.target);
        if(g.target === 50){
          multiplier = 2;
          multBadge.classList.add('show');
        }
        showToast('🎉 Цель достигнута: ' + g.text.replace(/<[^>]+>/g,''));
      }
    });

    renderGoals();
  });

  renderGoals();
</script>
</body>
</html>
